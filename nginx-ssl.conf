# P2-4 — Nginx HTTPS 反代（443 + Let's Encrypt）
#
# 用法：
#   1) 启用 HTTPS：编辑 docker-compose.yml 的 frontend service，加：
#        volumes:
#          - ./nginx-ssl.conf:/etc/nginx/nginx.conf:ro
#          - ./certbot/conf:/etc/letsencrypt:ro
#          - ./certbot/www:/var/www/certbot:ro
#        ports:
#          - "80:80"
#          - "443:443"
#        （让 80 仍可服务 ACME challenge + http 重定向到 https）
#
#   2) 初次签证书：在 host 上跑 scripts/init-letsencrypt.sh（见 P2-4 文档）
#
#   3) 自动续期：cron job 跑 certbot renew；详见脚本。
#
# 关键点：
#   - 80 端口：保留做 ACME http-01 challenge + 强制 301 → https
#   - 443 端口：ssl 终止 + SNI 多域名（按 server_name 路由）
#   - TLS 配置：Mozilla Intermediate + TLSv1.3 + 现代 cipher
#   - SSE / 反代配置：与 nginx.conf 保持一致

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ──────────────── TLS 配置 ────────────────
    # Mozilla Intermediate（参考：https://ssl-config.mozilla.org/）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    # HSTS：强制浏览器用 https（首次 6 个月，可逐步延长到 1 年）
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # WebSocket Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ──────────────── 80 端口：HTTP → HTTPS 重定向 + ACME challenge ────────────────
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME http-01 challenge（certbot webroot 验证）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其余全部 301 → https
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────── 443 端口：主 HTTPS 服务 ────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书（Let's Encrypt；路径由 certbot 卷挂载注入）
        ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
        # 真实部署时把 <DOMAIN> 替换成实际域名（如 ai.example.com）
        # 也可以用环境变量 sed 替换：envsubst '${DOMAIN}' < nginx-ssl.conf.template > nginx-ssl.conf

        # ACME challenge 也放一份（备用，部分 CA 支持 tls-alpn-01）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        root /usr/share/nginx/html;
        index index.html;

        # ── 静态资源（长缓存） ──
        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── /api 反代到 FastAPI（SSE / 流式） ──
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
            # SSE 关键：禁用缓冲
            proxy_buffering       off;
            proxy_request_buffering off;
            proxy_cache           off;
            proxy_set_header Connection "";
            add_header X-Accel-Buffering "no" always;
        }

        # ── /uploads 反代 ──
        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── WebSocket ──
        location /ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ── /metrics 反代（监控） ──
        location = /metrics {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            access_log off;
        }

        # ── SPA fallback ──
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # ── 健康检查 ──
        location = /api/health {
            proxy_pass http://backend;
            access_log off;
        }
    }
}
