name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────── 安全扫描 ───────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web_console/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web_console/package-lock.json') }}

      - name: Install
        working-directory: web_console
        run: npm ci --no-audit --no-fund

      - name: Audit production deps (--omit=dev)
        id: prod
        working-directory: web_console
        # --omit=dev 减少 devDep 噪声；--audit-level=moderate 只警告 moderate+
        # exit 0：即使有漏洞也继续，让后续 step 上传报告
        run: |
          set +e
          npm audit --omit=dev --audit-level=moderate --json > audit-prod.json
          echo "exit=$?" >> $GITHUB_OUTPUT
          cat audit-prod.json | head -200 || true
        continue-on-error: true

      - name: Audit dev deps (informational)
        id: dev
        working-directory: web_console
        run: |
          set +e
          npm audit --audit-level=low --json > audit-all.json
          echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Summarize to Step Summary
        if: always()
        run: |
          echo "## 🔒 Security audit summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s audit-prod.json ]; then
            node -e "
              const a = JSON.parse(require('fs').readFileSync('audit-prod.json','utf8'));
              const v = a.metadata?.vulnerabilities ?? {};
              const total = (v.critical||0)+(v.high||0)+(v.moderate||0)+(v.low||0)+(v.info||0);
              console.log('**Production deps vulnerabilities:** ' + total);
              console.log('');
              console.log('| Severity | Count |');
              console.log('|---|---|');
              console.log('| Critical | ' + (v.critical||0) + ' |');
              console.log('| High | ' + (v.high||0) + ' |');
              console.log('| Moderate | ' + (v.moderate||0) + ' |');
              console.log('| Low | ' + (v.low||0) + ' |');
              console.log('| Info | ' + (v.info||0) + ' |');
              if (total > 0) {
                console.log('');
                console.log('### Affected packages');
                const ad = a.vulnerabilities || {};
                for (const [name, info] of Object.entries(ad).slice(0,20)) {
                  const sev = info.severity || '?';
                  const via = (info.via||[]).map(x => typeof x === 'string' ? x : x.title || x.name).slice(0,3).join(', ');
                  console.log('- **' + name + '** (' + sev + ') — via: ' + via);
                }
              }
            " >> $GITHUB_STEP_SUMMARY || true
          else
            echo 'No audit report.' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            web_console/audit-prod.json
            web_console/audit-all.json
          retention-days: 30

      - name: Fail on high+ production vulnerabilities
        if: steps.prod.outcome == 'failure'
        run: |
          echo "::error::Production dependencies have high+ vulnerabilities. Run \`npm audit --omit=dev\` locally."
          exit 1

  # ─────────────── Workflow lint ───────────────
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web_console/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web_console/package-lock.json') }}
      - name: Install
        working-directory: web_console
        run: npm ci --no-audit --no-fund
      - name: Lint workflows
        working-directory: web_console
        run: npm run lint:workflows


  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web_console/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web_console/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install
        working-directory: web_console
        run: npm ci --no-audit --no-fund

      - name: Type check (app)
        working-directory: web_console
        run: npm run check

      - name: Type check (e2e)
        working-directory: web_console
        run: npx tsc -p tsconfig.e2e.json

  # ─────────────── 单测 ───────────────
  test:
    name: Vitest + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web_console/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web_console/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Vite prebundle
        uses: actions/cache@v4
        with:
          path: web_console/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('web_console/package-lock.json', 'web_console/vite.config.ts') }}
          restore-keys: ${{ runner.os }}-vite-

      - name: Install
        working-directory: web_console
        run: npm ci --no-audit --no-fund

      - name: Run vitest
        working-directory: web_console
        run: npm test

      - name: Generate coverage
        working-directory: web_console
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: web_console/coverage/
          retention-days: 7

      # ─────────────── 前端 coverage badge 自动生成 ───────────────
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web_console
        run: |
          # vitest --coverage 输出 coverage-summary.json
          npm i -g genbadge 2>/dev/null || true
          if [ -f coverage/coverage-summary.json ]; then
            genbadge coverage -i coverage/coverage-summary.json -o coverage-badge.svg
          fi

      - name: Commit frontend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web_console
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage-badge.svg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "✅ No badge changes."
          else
            git commit -m "ci: update frontend coverage badge [skip ci]"
            git push
            echo "✅ Frontend badge committed."
          fi

  # ─────────────── 视觉 baseline bootstrap ───────────────
  visual-baseline:
    name: Visual Baseline Bootstrap
    # 只在 main 上跑：自动维护 baseline 仓库
    # PR 跑 e2e 时如果 baseline 不存在，自动从 main 拉
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [type-check]
    permissions:
      contents: write   # 需要 commit baseline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web_console/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web_console/package-lock.json') }}

      - name: Cache Vite prebundle
        uses: actions.cache@v4
        with:
          path: web_console/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('web_console/package-lock.json', 'web_console/vite.config.ts') }}

      - name: Cache Playwright browsers
        uses: actions.cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web_console/package-lock.json') }}

      - name: Install
        working-directory: web_console
        run: npm ci --no-audit --no-fund

      - name: Install Playwright system deps + Chromium
        working-directory: web_console
        run: npx playwright install --with-deps chromium

      - name: Generate baseline (skip if exists)
        working-directory: web_console
        run: |
          if [ -d e2e/visual.spec.ts-snapshots ] && [ "$(ls -A e2e/visual.spec.ts-snapshots/*.png 2>/dev/null)" ]; then
            echo "✅ Baseline already exists, skipping."
            exit 0
          fi
          echo "📸 No baseline found. Generating initial baseline..."
          npx playwright test visual.spec.ts --update-snapshots

      - name: Auto-commit baseline
        working-directory: web_console
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --stat e2e/visual.spec.ts-snapshots | grep -q '.'; then
            git add e2e/visual.spec.ts-snapshots
            git commit -m "test: bootstrap visual regression baseline

            Auto-generated by visual-baseline job on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "✅ Baseline committed."
          else
            echo "✅ No baseline changes."
          fi


  e2e:
    name: Playwright E2E + Visual Regression
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # PR 跑时拉 main 的 baseline（如果存在），保证 visual diff 有基准
      - name: Fetch baseline from main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          if git ls-tree origin/main -- web_console/e2e/visual.spec.ts-snapshots 2>/dev/null | grep -q .; then
            git checkout origin/main -- web_console/e2e/visual.spec.ts-snapshots/ || true
            echo "✅ Baseline fetched from main"
          else
            echo "ℹ️ No baseline on main yet; first run will create one."
          fi

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web_console/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web_console/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Vite prebundle
        uses: actions.cache@v4
        with:
          path: web_console/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('web_console/package-lock.json', 'web_console/vite.config.ts') }}
          restore-keys: ${{ runner.os }}-vite-

      - name: Cache Playwright browsers
        uses: actions.cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web_console/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install
        working-directory: web_console
        run: npm ci --no-audit --no-fund

      - name: Install Playwright system deps + Chromium
        working-directory: web_console
        run: npx playwright install --with-deps chromium

      - name: Run E2E + Visual
        working-directory: web_console
        run: npm run e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: web_console/playwright-report/, retention-days: 7 }

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: web_console/test-results/, retention-days: 3 }

      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: visual-diff, path: web_console/e2e/**/*-snapshots/*-diff.png, retention-days: 7 }

  # ─────────────── 生产构建（带 cache 加速） ───────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web_console/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web_console/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Vite prebundle
        uses: actions/cache@v4
        with:
          path: web_console/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('web_console/package-lock.json', 'web_console/vite.config.ts') }}
          restore-keys: ${{ runner.os }}-vite-

      - name: Install
        working-directory: web_console
        run: npm ci --no-audit --no-fund

      # ──── dist 产物 cache 实现 hot rebuild ────
      - name: Restore dist cache (hot rebuild)
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: web_console/dist
          # 只在 source 没有变化的分支上复用 dist
          # source hash 包含：源码 + 配置 + 依赖
          key: ${{ runner.os }}-dist-${{ hashFiles('web_console/package-lock.json', 'web_console/vite.config.ts', 'web_console/tsconfig.json', 'web_console/index.html', 'web_console/src/**/*') }}
          restore-keys: ${{ runner.os }}-dist-

      - name: Build (skip if cache hit)
        id: build
        working-directory: web_console
        # cache hit → dist 已就位 → 跳过 vite build
        # cache miss → 真正构建 → post-step 上传给下次恢复
        run: |
          if [ -f dist/index.html ]; then
            echo "✅ dist cache hit — skipping build"
            echo "cache_hit=true" >> $GITHUB_OUTPUT
          else
            echo "🔨 Building from source..."
            npm run build
            echo "cache_hit=false" >> $GITHUB_OUTPUT
          fi

      - name: Show dist size
        working-directory: web_console
        if: always()
        run: |
          du -sh dist/ 2>/dev/null || true
          find dist/ -name "*.js" -o -name "*.css" 2>/dev/null | head -10 | xargs ls -lh 2>/dev/null || true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with: { name: dist, path: web_console/dist/, retention-days: 7 }
