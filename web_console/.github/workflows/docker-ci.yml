name: Docker CI

on:
  push:
    branches: [main, master]
    paths:
      - 'web_console/Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'ai_agent/requirements.txt'
      - 'ai_agent/web_ui.py'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    paths:
      - 'web_console/Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'ai_agent/requirements.txt'
      - 'ai_agent/web_ui.py'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push to ghcr.io

env:
  IMAGE_NAME: ai-agent-console

jobs:
  # ─────────────── Build & test Docker image ───────────────
  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web_console/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true    # 加载到本地 runner 用于测试

      - name: Image size check
        id: size-check
        run: |
          SIZE=$(docker image inspect ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          SIZE_MB_PRECISE=$(python3 -c "print(f'{${SIZE} / 1024 / 1024:.2f}')")
          echo "image_size_mb=$SIZE_MB_PRECISE" >> $GITHUB_OUTPUT
          echo "📦 Image size: ${SIZE_MB_PRECISE} MB"

          # 阈值：警告 / 失败
          WARN_MB=800
          FAIL_MB=1500
          if (( $(echo "$SIZE_MB_PRECISE > $FAIL_MB" | bc -l) )); then
            echo "::error::Image size ${SIZE_MB_PRECISE}MB > ${FAIL_MB}MB hard limit."
            exit 1
          elif (( $(echo "$SIZE_MB_PRECISE > $WARN_MB" | bc -l) )); then
            echo "::warning::Image size ${SIZE_MB_PRECISE}MB > ${WARN_MB}MB. Consider:"
            echo "  - 检查是否遗漏 .dockerignore"
            echo "  - 多阶段构建（已用，但可优化）"
            echo "  - 用 python:3.11-slim 而非 full image"
            echo "  - pip install --no-cache-dir"
            echo "  - 清理 apt cache: rm -rf /var/lib/apt/lists/*"
          fi

      - name: Track image size history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .docker-history
          SIZE_MB="${{ steps.size-check.outputs.image_size_mb }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${SHA},$(date -u +%Y-%m-%dT%H:%M:%SZ),${SIZE_MB}MB" >> .docker-history/sizes.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .docker-history/sizes.csv
          if ! git diff --cached --quiet; then
            git commit -m "ci: record image size ${SIZE_MB}MB [skip ci]"
            git push
          fi

      - name: Show top-10 largest layers
        if: failure()
        run: |
          echo "=== Top 10 largest layers ==="
          docker history ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} --no-trunc --format "table {{.Size}}\t{{.CreatedBy}}" | head -15

      # ─────────────── 启动容器并冒烟测试 ───────────────
      - name: Run container
        id: run
        run: |
          docker run -d --rm \
            -p 8000:8000 \
            -e OPENAI_API_KEY=sk-dummy \
            --name ai-agent-test \
            ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          sleep 10  # 等启动

      - name: Health check
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "✅ Backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Backend failed to start"
          docker logs ai-agent-test
          exit 1

      - name: Test critical endpoints
        run: |
          # GET / 静态资源
          curl -fsS -o /dev/null -w "GET /: %{http_code}\n" http://127.0.0.1:8000/
          # GET /api/health
          curl -fsS http://127.0.0.1:8000/api/health
          echo
          # GET /api/capabilities
          curl -fsS http://127.0.0.1:8000/api/capabilities | head -c 200
          echo
          # GET /api/agents
          curl -fsS http://127.0.0.1:8000/api/agents | head -c 200
          echo

      - name: Upload image artifact (only on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 7

      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} > /tmp/docker-image.tar

      - name: Cleanup container
        if: always()
        run: docker stop ai-agent-test 2>/dev/null || true

  # ─────────────── Push to GHCR（仅 main） ───────────────
  push-ghcr:
    name: Push to GitHub Container Registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web_console/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
