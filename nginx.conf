# nginx.conf — 生产环境反向代理
#
# 拓扑：
#   :80 (nginx)
#     ├─ /          → web/dist (Vite 构建产物，浏览器 SPA)
#     ├─ /assets/   → 长期缓存 (1y)
#     └─ /api/, /ws → 反代 backend:8000 (FastAPI)
#
# 设计要点：
#   - SPA fallback: 所有未匹配路径回退到 /index.html (前端 Vue Router 处理)
#   - 静态资源 gzip + 长缓存; HTML 不缓存 (避免新版本被旧 index 卡住)
#   - /api 反代保留 Host / X-Real-IP / X-Forwarded-* 头，方便后端日志审计
#   - WebSocket 升级走 /ws 路径 (后端 app.py 含 WebSocket 端点)
#   - 上传 endpoint (multipart) client_max_body_size 提到 50M

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip 压缩（除已压缩格式外）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # 上传体积（前端偶尔传图）
    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 后端 WebSocket 长连接
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ai_agent_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ──────────────── 静态资源（长缓存） ────────────────
        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ──────────────── /api 反代到 FastAPI ────────────────
        location /api/ {
            proxy_pass         http://ai_agent_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering       off;
        }

        # ──────────────── WebSocket 反代 ────────────────
        location /ws {
            proxy_pass         http://ai_agent_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;   # 24h 长会话
        }

        # ──────────────── SPA fallback ────────────────
        # 其它未匹配路径全部回退到 index.html，由前端 Vue Router 处理
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # ──────────────── 健康检查端点（直透后端） ────────────────
        location = /api/health {
            proxy_pass http://ai_agent_backend;
            access_log off;
        }
    }
}
