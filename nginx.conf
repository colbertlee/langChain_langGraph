# nginx.conf — 生产环境反向代理（前后端彻底解耦）
#
# 拓扑：
#   :80 (nginx)  ──┬─ /                  → /usr/share/nginx/html  (Vite 静态产物 + SPA fallback)
#                  ├─ /assets/           → 长缓存静态资源
#                  └─ /api/, /ws, /uploads → http://backend:8000  (FastAPI)
#
# 设计要点：
#   1) FastAPI (backend:8000) 仅作 API 服务，不托管前端 HTML/路由；
#   2) /api/ 反代开启 SSE / 流式响应支持：
#        - proxy_buffering off                （禁用缓冲，按 chunk 透传）
#        - proxy_http_version 1.1
#        - 较大的 read/send timeout           （适配长 LLM 流）
#        - X-Accel-Buffering: no              （即使后端设置也再传一次）
#   3) SPA fallback: try_files $uri $uri/ /index.html
#   4) WebSocket: /ws 走独立 location（Upgrade/Connection 头）
#   5) 上传大小：client_max_body_size 50M
#   6) 容器内通过 docker-compose 网络，upstream = backend:8000

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip（除已压缩格式）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # 上传体积（前端偶尔传图）
    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # WebSocket 升级头映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 后端 upstream —— 容器网络服务名必须为 backend
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ──────────────── 静态资源（长缓存） ────────────────
        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ──────────────── /api 反代到 FastAPI（SSE / 流式） ────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 连接 / 读 / 写 超时（适配长 LLM 流）
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
            # 禁用缓冲：让 SSE / chunk 立刻抵达客户端
            proxy_buffering       off;
            proxy_request_buffering off;
            proxy_cache           off;
            # 透传 chunked + 告诉后端 nginx 会立刻转发
            proxy_set_header Connection "";
            add_header X-Accel-Buffering "no" always;
        }

        # ──────────────── /uploads 反代到 FastAPI（用户上传文件） ────────────────
        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ──────────────── WebSocket 反代 ────────────────
        location /ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;   # 24h 长会话
        }

        # ──────────────── /metrics 反代（Prometheus scrape） ────────────────
        location = /metrics {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            access_log off;
        }

        # ──────────────── SPA fallback ────────────────
        # 其它未匹配路径全部回退到 index.html，由前端 React Router 处理
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # ──────────────── 健康检查（直透后端） ────────────────
        location = /api/health {
            proxy_pass http://backend;
            access_log off;
        }
    }
}