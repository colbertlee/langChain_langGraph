name: Bug Report
description: Report a bug in the AI Agent Console
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      content: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the software are you running?
      placeholder: "e.g. commit abc1234 / v1.2.3 / main branch"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part has the bug?
      options:
        - Frontend (web_console)
        - Backend API (ai_agent/web_ui.py)
        - Backend Agent (ai_agent/agent.py)
        - MCP Server (ai_agent/mcp_server.py)
        - Tools (ai_agent/tools.py)
        - Security (ai_agent/security.py)
        - CI / Workflow (.github/workflows/)
        - Tests (vitest / pytest)
        - Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        1. Go to '...'
        2. Click on '...'
        3. Run '...'
        4. See error
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: |
        Paste relevant logs, screenshots, or stack traces.
        Use markdown code blocks (```) for logs.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (system unusable)
        - High (major feature broken)
        - Medium (workaround exists)
        - Low (cosmetic / minor)
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched for similar issues
          required: true
        - label: I have tested on the latest main branch
          required: false
        - label: I have attached reproduction logs
          required: false

  - type: input
    id: env
    attributes:
      label: Environment (OS, browser, Node/Python version)
      placeholder: "e.g. macOS 14 / Chrome 120 / Python 3.11 / Node 20"