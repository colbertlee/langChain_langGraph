name: Harness Eval (Weekly)

# P2-6 — CI 跑真实 agent 评估（harness dry-run）
#
# 触发条件：
#   - schedule: 每周 UTC 周一 02:00 跑一次（监控 agent 长期回归）
#   - workflow_dispatch: 手动触发（选 dry-run / full）
#   - 可被 release.yml 调用（发版前跑全量）
#
# 设计：
#   1) 默认 dry-run（不调真实 LLM，避免 CI 跑失败）；只校验 harness 流程完整性。
#   2) manual dispatch 允许选 full eval，需要 OPENAI_API_KEY。
#   3) baseline 比对：本次分数 vs baseline（git tree 里存的 baseline.json）。
#      退化 > 5% → fail。
#   4) 上传 evals/runs/<timestamp>/ 到 artifacts（保留 30 天）。
#   5) 自动创建 issue（如果退化）—— 用 github-script。

on:
  schedule:
    # 每周一 UTC 02:00（北京时间 10:00）
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Eval mode (dry-run / full)"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - full
      threshold:
        description: "Pass rate threshold (0-1)"
        required: false
        type: number
        default: 0.7
  workflow_call:

permissions:
  contents: read
  issues: write  # 自动创建退化 issue

env:
  PYTHON_VERSION: "3.11"
  HARNESS_LOG_LEVEL: "INFO"
  BASELINE_FILE: ".harness/baseline.json"

jobs:
  # ════════════════════════════════════════════════════════════════
  # 1. Harness dry-run 回归
  # ════════════════════════════════════════════════════════════════
  harness-dry-run:
    name: Harness ${{ github.event.inputs.mode || 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 curl

      - name: Install Python deps
        working-directory: ai_agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine eval mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.mode }}"
          else
            mode="dry-run"
          fi
          echo "mode=$mode" >> $GITHUB_OUTPUT

      - name: Run harness eval
        working-directory: ai_agent
        env:
          # dry-run 不调真实 LLM；full eval 才用 secret
          OPENAI_API_KEY: ${{ steps.mode.outputs.mode == 'full' && secrets.OPENAI_API_KEY || 'sk-dry-run-noop' }}
          AI_AGENT_DISABLE_PLACEHOLDER_CHECK: ${{ steps.mode.outputs.mode == 'full' && '' || '1' }}
        run: |
          set -e
          mkdir -p evals/runs/${{ github.run_id }}
          # v2.4 — ai-agent-harness CLI
          python -m harness_cli \
            --set evals/sets/smoke_v1.jsonl \
            --out evals/runs/${{ github.run_id }} \
            --tag ${{ steps.mode.outputs.mode }} \
            --threshold ${{ github.event.inputs.threshold || 0.5 }} \
            ${{ steps.mode.outputs.mode == 'dry-run' && '--dry-run' || '' }}

      - name: Parse eval summary
        id: summary
        working-directory: ai_agent
        if: always()
        run: |
          summary_file="evals/runs/${{ github.run_id }}/summary.json"
          if [ ! -f "$summary_file" ]; then
            echo "::error::summary.json not found"
            exit 1
          fi
          pass_rate=$(python -c "import json; d=json.load(open('$summary_file')); print(d.get('pass_rate', 0))")
          total=$(python -c "import json; d=json.load(open('$summary_file')); print(d.get('total', 0))")
          passed=$(python -c "import json; d=json.load(open('$summary_file')); print(d.get('passed', 0))")
          echo "pass_rate=$pass_rate" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "passed=$passed" >> $GITHUB_OUTPUT
          echo "## Harness Eval Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ steps.mode.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pass rate: $pass_rate ($passed/$total)" >> $GITHUB_STEP_SUMMARY

      - name: Compare to baseline (regression gate)
        working-directory: ai_agent
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -e
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::Baseline not found at $BASELINE_FILE; skipping regression check"
            echo "::notice::First run; this becomes the new baseline"
            # 把当前结果存为新 baseline
            mkdir -p "$(dirname $BASELINE_FILE)"
            cp "evals/runs/${{ github.run_id }}/summary.json" "$BASELINE_FILE"
            exit 0
          fi
          baseline_rate=$(python -c "import json; print(json.load(open('$BASELINE_FILE')).get('pass_rate', 0))")
          current_rate="${{ steps.summary.outputs.pass_rate }}"
          delta=$(python -c "print(float('$current_rate') - float('$baseline_rate'))")
          echo "Baseline pass_rate: $baseline_rate"
          echo "Current pass_rate:  $current_rate"
          echo "Delta: $delta"
          # 退化阈值：> 5% 绝对值
          threshold=-0.05
          if python -c "import sys; sys.exit(0 if float('$delta') > -0.05 else 1)"; then
            echo "✅ Within regression threshold (>= -5%)"
          else
            echo "::error::Regression detected: $delta (below -5%)"
            # 失败但不让 CI 直接 fail（让 operator 看到 summary 后人工 review）
            # 也可以 exit 1 让 CI fail
            exit 1
          fi

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-${{ github.run_id }}
          path: ai_agent/evals/runs/${{ github.run_id }}/
          retention-days: 30

      - name: Create regression issue
        if: failure() && steps.mode.outputs.mode == 'full'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = {
              pass_rate: '${{ steps.summary.outputs.pass_rate }}',
              total: '${{ steps.summary.outputs.total }}',
              passed: '${{ steps.summary.outputs.passed }}',
            };
            const title = `🔴 Harness Eval Regression (${summary.pass_rate})`;
            const body = `## Harness eval regression detected\n\n` +
              `- Mode: full\n` +
              `- Pass rate: ${summary.passed}/${summary.total} (${summary.pass_rate})\n` +
              `- Run: ${{ github.run_id }}\n` +
              `- Artifact: harness-eval-${{ github.run_id }}\n\n` +
              `> 自动创建，请人工 review evals/runs/${{ github.run_id }}/summary.json 后决定是否回滚。`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['eval-regression', 'harness'],
            });
