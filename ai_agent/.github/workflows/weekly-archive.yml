# Weekly Archive Acceptance（Day 20）
#
# 目的：
# - 每周日 0:00 UTC 跑一次 archive_acceptance，**非阻塞**收集趋势数据；
# - 区别于 release-build.yml 的 archive-acceptance gate（gate 阻塞 release）；
# - 不开 PR、不开 issue（Slack 通知为主），便于日常观察；
#
# 为什么非阻塞：
# - release-build 已 gate，重跑一周多次意义不大；
# - 这里的目的就是 *增量趋势数据* —— 让 TREND.md / CHANGELOG.md 持续更新。
#
# 时区：
# - cron "0 0 * * 0" = UTC 周日 0:00 = 北京时间周日 8:00 am
# - 错开 daily-doctor（UTC 1:00 = 北京 9:00）

name: weekly-archive

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 00:00
  workflow_dispatch:
    inputs:
      strict:
        description: '严格模式（任意 FAIL 都视为失败）'
        required: false
        default: 'false'

permissions:
  contents: write   # 用于 push 更新 CHANGELOG.md / TREND.md
  issues: write     # 用于发现退步时开 issue

defaults:
  run:
    working-directory: ai_agent

jobs:
  weekly-archive:
    name: weekly-archive
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NIGHTLY_QUIET: ${{ vars.NIGHTLY_QUIET }}
      DOCTOR_UI_URL: ${{ vars.DOCTOR_UI_URL || 'http://localhost:8000/web/doctor' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai_agent/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ────────────────── 跑 acceptance ──────────────────
      - name: Run archive acceptance
        id: acceptance
        shell: bash
        run: |
          set +e
          python tools/archive_acceptance.py --strict --timeout 600
          rc=$?
          echo "acceptance_exit=$rc"
          exit $rc

      # ────────────────── 趋势报告 ──────────────────
      - name: Generate trend report
        if: always()
        shell: bash
        run: |
          python tools/archive_trend.py --output tests-archive/TREND.md

      # ────────────────── append changelog（emoji 退化信号）──────────────────
      - name: Append changelog line
        if: success()
        shell: bash
        run: |
          python tools/archive_changelog.py --prune-days 90

      # ────────────────── 推 git：TREND.md + CHANGELOG.md + acceptance/<ts>/ ──────────────────
      - name: Commit & push weekly updates
        if: success()
        shell: bash
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add tests-archive/TREND.md tests-archive/CHANGELOG.md tests-archive/acceptance/ 2>/dev/null || true

          # 检查是否有改动
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi

          # 提交并推
          git commit -m "chore(archive): weekly acceptance update $(date +%Y-%m-%d)

          Auto-generated by weekly-archive workflow.
          - TREND.md updated
          - CHANGELOG.md appended
          - acceptance/<ts>/summary.json added"
          git push origin HEAD:main || \
            echo "::warning::push failed; data still in artifact"

      # ────────────────── Slack 通知（emoji 退化信号）──────────────────
      - name: Slack notify (regression detected)
        if: failure()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "no SLACK_WEBHOOK_URL; skip"
            exit 0
          fi
          python tools/doctor_chatops.py \
            --channel slack \
            --webhook "$SLACK_WEBHOOK_URL" || true

      - name: Discord notify (regression detected)
        if: failure()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "no DISCORD_WEBHOOK_URL; skip"
            exit 0
          fi
          python tools/doctor_chatops.py \
            --channel discord \
            --webhook "$DISCORD_WEBHOOK_URL" || true

      # ────────────────── upload artifacts ──────────────────
      - name: Upload weekly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-archive-${{ github.run_id }}
          path: |
            ai_agent/tests-archive/ACCEPTANCE.md
            ai_agent/tests-archive/TREND.md
            ai_agent/tests-archive/CHANGELOG.md
            ai_agent/tests-archive/acceptance/
          if-no-files-found: warn
          retention-days: 60