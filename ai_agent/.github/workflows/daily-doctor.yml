# Daily Doctor ChatOps（Day 17）
#
# 目的：每日 09:00 推一次 health 到 Slack（或 Discord），让值班者看到项目状态。
# 区别于 ``nightly-evals.yml``：
#   - nightly-evals 失败推送（红色）→ Slack/Discord/Issue
#   - daily-doctor 任何时候推送（含 OK 状态）→ Slack "daily-health" channel
#
# Secrets / Vars:
# - SLACK_DAILY_HEALTH_WEBHOOK (推荐)  -- 专门用于"日常健康"的 Slack incoming webhook
#                                          不提供时退化为读 SLACK_WEBHOOK_URL
# - DISCORD_DAILY_WEBHOOK (可选)        -- 单独推送 Discord
#
# Vars:
# - SLACK_DAILY_CHANNEL                  -- Slack channel，缺省 #daily-health
# - NIGHTLY_QUIET                        -- "true" 时彻底静默（debug 用）

name: daily-doctor

on:
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: '严格模式（任何 FAIL 都视为失败）'
        required: false
        default: 'false'

permissions:
  contents: read

defaults:
  run:
    working-directory: ai_agent

jobs:
  daily-doctor:
    name: daily-doctor-chatops
    runs-on: ubuntu-latest
    env:
      NIGHTLY_QUIET: ${{ vars.NIGHTLY_QUIET }}
      SLACK_DAILY_HEALTH_WEBHOOK: ${{ secrets.SLACK_DAILY_HEALTH_WEBHOOK || secrets.SLACK_WEBHOOK_URL }}
      SLACK_DAILY_CHANNEL: ${{ vars.SLACK_DAILY_CHANNEL || '#daily-health' }}
      DISCORD_DAILY_WEBHOOK: ${{ secrets.DISCORD_DAILY_WEBHOOK }}
      STRICT: ${{ inputs.strict || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai_agent/requirements.txt

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run doctor (JSON)
        id: doctor
        shell: bash
        run: |
          python -m doctor --json > doctor.json || true
          head -c 1000 doctor.json
          echo ""

      - name: Send to Slack
        if: env.SLACK_DAILY_HEALTH_WEBHOOK != '' && env.NIGHTLY_QUIET != 'true'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DAILY_HEALTH_WEBHOOK || secrets.SLACK_WEBHOOK_URL }}
        run: |
          python tools/doctor_chatops.py \
            --channel slack \
            --webhook "$SLACK_WEBHOOK_URL"

      - name: Send to Discord
        if: env.DISCORD_DAILY_WEBHOOK != '' && env.NIGHTLY_QUIET != 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_WEBHOOK }}
        run: |
          python tools/doctor_chatops.py \
            --channel discord \
            --webhook "$DISCORD_WEBHOOK_URL"

      - name: Strict mode check
        if: env.STRICT == 'true'
        shell: bash
        run: |
          # 严格模式：FAIL 数 > 0 → 视为 workflow 失败
          FAIL=$(python -c "
          import json
          with open('doctor.json','r',encoding='utf-8') as f:
              data = json.load(f)
          print(data['summary']['fail'])
          ")
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::doctor reported $FAIL failures"
            exit 1
          fi

      - name: Upload doctor.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-daily
          path: ai_agent/doctor.json
          if-no-files-found: warn
          retention-days: 30

      # ─────────────────── Day 20：archive 趋势 SVG 仪表板 ───────────────────
      # 生成 SVG → 上传到 Slack（files.upload v2）作为 image。
      # 即使 archive 没退化也生成图（让 daily-health 始终有数据可视化）。
      - name: Generate archive dashboard SVG
        if: success()
        shell: bash
        run: |
          python tools/archive_dashboard.py --output tests-archive/dashboard.svg
          head -c 200 tests-archive/dashboard.svg
          echo ""

      # Day 25：生成跨 dashboard 集成 hub HTML
      - name: Generate dashboard hub
        if: success()
        shell: bash
        run: |
          python tools/dashboard_hub.py --title "Daily Observability"
          ls -la tests-archive/dashboard_hub.html

      - name: Upload dashboard SVG to Slack
        if: success() && env.SLACK_WEBHOOK_URL != ''
        shell: bash
        env:
          # Day 20：用 bot token + channel 上传 SVG（与 webhook 推送并存）
          # 推荐：设 secrets.SLACK_BOT_TOKEN = xoxb-...，secrets.SLACK_DAILY_CHANNEL = #daily-health
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DAILY_CHANNEL: ${{ vars.SLACK_DAILY_CHANNEL || '#daily-health' }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::notice::SLACK_BOT_TOKEN not set; skipping SVG upload"
            exit 0
          fi
          python tools/archive_dashboard.py \
            --output tests-archive/dashboard.svg \
            --slack-token "$SLACK_BOT_TOKEN" \
            --slack-channel "$SLACK_DAILY_CHANNEL" \
            --title "tests-archive trend"