<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>stage-a wrapper — chat view</title>
<style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="f" src="/?v=stage-a&demo=1"></iframe>
<script>
  const f = document.getElementById('f');
  f.onload = () => {
    setTimeout(() => {
      try {
        const w = f.contentWindow;
        try {
          const app = w.document.getElementById('app');
          if (app) app.classList.remove('with-right');
        } catch(e) {}
        if (typeof w.__demo_inject === 'function') w.__demo_inject();
      } catch (e) { console.error(e); }
    }, 1500);
  };
</script>
</body>
</html>
