<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent · 工作台测试中心</title>
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #15161a;
    --surface-2: #1c1d22;
    --border: #2a2b30;
    --text: #e6e7eb;
    --text-dim: #8a8c95;
    --primary: #06b6d4;
    --primary-2: #3b82f6;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #f43f5e;
    --code-bg: #0e0f12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  /* 顶部 */
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(10,10,11,0.95), rgba(10,10,11,0.85));
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 {
    margin: 0; font-size: 16px; font-weight: 600;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 12px; align-items: center; }
  .meta .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim);
  }
  .meta .dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); animation: pulse 2s infinite; }
  .meta .dot.offline { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  /* 布局 */
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 50px); }
  /* 侧栏 */
  nav {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    overflow-y: auto;
    max-height: calc(100vh - 50px);
  }
  nav .group-title {
    padding: 8px 20px;
    font-size: 11px; text-transform: uppercase;
    color: var(--text-dim); letter-spacing: 1px;
  }
  nav button {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    background: none; border: none;
    color: var(--text); text-align: left;
    padding: 10px 20px;
    font-size: 13px; cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
  }
  nav button:hover { background: var(--surface-2); }
  nav button.active {
    background: var(--surface-2);
    border-left-color: var(--primary);
    color: var(--primary);
  }
  nav button .ico { font-size: 15px; }
  nav .count {
    margin-left: auto;
    background: var(--surface-2);
    padding: 1px 7px; border-radius: 10px;
    font-size: 10px; color: var(--text-dim);
    font-family: "JetBrains Mono", monospace;
  }
  nav button.active .count {
    background: var(--primary); color: white;
  }
  /* 主区 */
  main {
    padding: 24px 32px 80px;
    overflow-y: auto;
    max-height: calc(100vh - 50px);
  }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.25s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .panel-header { margin-bottom: 24px; }
  .panel h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .panel .desc { color: var(--text-dim); font-size: 13px; }
  .panel .desc code {
    background: var(--code-bg); padding: 1px 6px; border-radius: 3px;
    font-family: "JetBrains Mono", monospace; font-size: 12px;
  }
  /* 卡片网格 */
  .card-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex; flex-direction: column;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--primary); }
  .card h3 {
    margin: 0 0 6px; font-size: 14.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h3 .ico { font-size: 16px; }
  .card .ep {
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px; color: var(--text-dim);
    margin-bottom: 8px;
  }
  .card .ep code {
    background: var(--code-bg); padding: 1px 6px; border-radius: 3px;
    color: var(--primary);
  }
  .card .desc-mini {
    font-size: 12px; color: var(--text-dim);
    margin-bottom: 12px; flex: 1;
  }
  .card .actions {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  /* 按钮 */
  button.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border: none; color: white;
    padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 500;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(6,182,212,0.3); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  button.ghost {
    background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px;
  }
  button.ghost:hover { background: var(--border); }
  button.mini {
    background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-dim);
    padding: 4px 10px; border-radius: 4px;
    cursor: pointer; font-size: 11px;
  }
  button.mini:hover { color: var(--text); }
  /* 输入区 */
  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .input-area .row {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 10px;
  }
  .input-area .row:last-child { margin-bottom: 0; }
  .input-area label {
    font-size: 12px; color: var(--text-dim);
    min-width: 70px;
  }
  input[type="text"], input[type="number"], textarea, select {
    flex: 1; min-width: 0;
    background: var(--code-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 12.5px;
    outline: none;
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
    border-color: var(--primary);
  }
  textarea { resize: vertical; min-height: 70px; }
  /* 输出区 */
  .output {
    margin-top: 12px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 80px;
    max-height: 500px;
    overflow-y: auto;
    line-height: 1.6;
  }
  .output:empty::before {
    content: '等待执行…';
    color: var(--text-dim); font-style: italic;
  }
  .output .pass { color: var(--success); }
  .output .fail { color: var(--danger); }
  .output .warn { color: var(--warning); }
  .output .info { color: var(--primary); }
  .output .key { color: #a78bfa; }
  .output .str { color: #fbbf24; }
  /* 状态行 */
  .status-row {
    display: flex; gap: 8px; align-items: center;
    font-size: 11px; color: var(--text-dim);
    margin-bottom: 8px;
  }
  .status-row .badge {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 4px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
  }
  /* chat 样式 */
  .chat-stream {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    min-height: 240px;
    max-height: 420px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .chat-msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    word-break: break-word;
  }
  .chat-msg.user {
    background: var(--primary);
    color: white;
    margin-left: auto;
  }
  .chat-msg.assistant {
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .chat-msg.error {
    background: rgba(244, 63, 94, 0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  .chat-msg.system {
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid var(--warning);
    color: var(--warning);
    font-size: 12px;
  }
  .chat-msg .role {
    font-size: 10px; color: var(--text-dim);
    margin-bottom: 4px; text-transform: uppercase;
  }
  .chat-msg .content { font-size: 13px; white-space: pre-wrap; }
  /* 列表卡 */
  .list-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .list-item .ico {
    font-size: 16px; padding-top: 2px;
  }
  .list-item .body { flex: 1; min-width: 0; }
  .list-item .title {
    font-size: 13px; font-weight: 500;
    margin-bottom: 4px;
  }
  .list-item .meta {
    font-size: 11px; color: var(--text-dim);
    font-family: "JetBrains Mono", monospace;
  }
  .list-item .actions {
    display: flex; gap: 6px;
  }
  /* 空状态 */
  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 13px;
  }
  .empty .ico {
    font-size: 36px; opacity: 0.4;
    margin-bottom: 12px;
  }
  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3b40; }
  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 100;
    animation: slideUp 0.25s;
  }
  .toast.ok { border-color: var(--success); color: var(--success); }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ====== 测试浮窗 ====== */
  .tester-toggle {
    position: fixed; right: 20px; bottom: 80px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white;
    border: none; cursor: pointer;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(6,182,212,0.4);
    z-index: 90;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .tester-toggle:hover { transform: scale(1.1); }
  .tester-toggle .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--danger); color: white;
    font-size: 10px; padding: 2px 6px; border-radius: 10px;
    font-weight: 600; min-width: 18px; text-align: center;
    font-family: "JetBrains Mono", monospace;
  }
  .tester-toggle .badge.hidden { display: none; }

  .tester-panel {
    position: fixed; top: 50px; right: 0;
    width: 420px; max-width: 90vw;
    height: calc(100vh - 50px);
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
    z-index: 89;
    display: none;
    flex-direction: column;
  }
  .tester-panel.open { display: flex; }
  .tester-panel header {
    padding: 14px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: relative;
  }
  .tester-panel header h3 {
    margin: 0; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .tester-panel header .actions {
    display: flex; gap: 6px;
  }
  .tester-panel .icon-mini {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 26px; height: 26px;
    border-radius: 6px;
    cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .tester-panel .icon-mini:hover { background: var(--border); }

  .tester-stats {
    padding: 10px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    font-size: 11px;
  }
  .tester-stats .stat-cell {
    text-align: center;
  }
  .tester-stats .num {
    font-size: 18px; font-weight: 600;
    font-family: "JetBrains Mono", monospace;
  }
  .tester-stats .num.pass { color: var(--success); }
  .tester-stats .num.fail { color: var(--danger); }
  .tester-stats .num.warn { color: var(--warning); }
  .tester-stats .lbl { color: var(--text-dim); font-size: 10px; }

  .tester-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .tester-entry {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .tester-entry:hover { border-color: var(--primary); }
  .tester-entry.pass { border-left: 3px solid var(--success); }
  .tester-entry.fail { border-left: 3px solid var(--danger); }
  .tester-entry.warn { border-left: 3px solid var(--warning); }

  .tester-entry .head {
    padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .tester-entry .head .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
  }
  .tester-entry.fail .head .status-dot { background: var(--danger); }
  .tester-entry.warn .head .status-dot { background: var(--warning); }
  .tester-entry .head .method {
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
    background: var(--surface-2); color: var(--text-dim);
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
  }
  .tester-entry .head .method.POST { background: rgba(6,182,212,0.15); color: var(--primary); }
  .tester-entry .head .method.DELETE { background: rgba(244,63,94,0.15); color: var(--danger); }
  .tester-entry .head .path {
    flex: 1; min-width: 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tester-entry .head .dt {
    font-size: 10.5px;
    color: var(--text-dim);
    font-family: "JetBrains Mono", monospace;
    min-width: 48px; text-align: right;
  }
  .tester-entry .head .dt.slow { color: var(--warning); }
  .tester-entry .head .dt.vslow { color: var(--danger); }
  .tester-entry .head .arrow {
    color: var(--text-dim);
    transition: transform 0.15s;
  }
  .tester-entry.open .head .arrow { transform: rotate(90deg); }

  .tester-entry .body {
    display: none;
    padding: 0 12px 12px;
    font-size: 11.5px;
    line-height: 1.6;
  }
  .tester-entry.open .body { display: block; }

  .tester-entry .checks {
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 0;
  }
  .tester-entry .check {
    display: flex; gap: 6px; align-items: flex-start;
    font-size: 11px;
  }
  .tester-entry .check.pass .ico { color: var(--success); }
  .tester-entry .check.fail .ico { color: var(--danger); }
  .tester-entry .check .ico { font-size: 12px; flex-shrink: 0; }
  .tester-entry .check .label { color: var(--text-dim); font-weight: 500; min-width: 78px; }
  .tester-entry .check .msg { color: var(--text); flex: 1; }
  .tester-entry .check .msg code {
    background: var(--code-bg); padding: 1px 5px; border-radius: 3px;
    font-family: "JetBrains Mono", monospace;
  }

  .tester-entry .resp-preview {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-dim);
  }
  .tester-entry .actions-row {
    display: flex; gap: 4px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .tester-entry .actions-row button {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px; border-radius: 5px;
    cursor: pointer; font-size: 10.5px;
  }
  .tester-entry .actions-row button:hover { background: var(--border); }
  .tester-entry .timestamp {
    color: var(--text-dim);
    font-size: 10px;
    font-family: "JetBrains Mono", monospace;
  }

  .tester-empty {
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 12px;
  }
  .tester-empty .ico { font-size: 36px; opacity: 0.4; margin-bottom: 12px; }
  /* 模型选择器 */
  .model-row {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex; gap: 12px; align-items: center;
  }
  .model-row .name {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    min-width: 100px;
  }
  .model-row .desc-mini {
    color: var(--text-dim); font-size: 11.5px;
    flex: 1;
  }
  .model-row .badge-warn {
    background: rgba(245, 158, 11, 0.15);
    color: var(--warning);
    padding: 2px 8px; border-radius: 4px;
    font-size: 10.5px;
  }
  .model-row .badge-ok {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
    padding: 2px 8px; border-radius: 4px;
    font-size: 10.5px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat .num {
    font-size: 22px; font-weight: 600;
    color: var(--primary);
  }
  .stat .lbl {
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }
  details {
    margin-top: 10px;
  }
  details summary {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px;
    user-select: none;
  }
</style>
</head>
<body>

<header>
  <h1>🧪 AI Agent 工作台测试中心</h1>
  <div class="meta">
    <span><span id="backend-dot" class="dot"></span><span id="backend-status">未连接</span></span>
    <span>·</span>
    <span id="clock"></span>
  </div>
</header>

<!-- 测试浮窗：右下角按钮 + 右侧面板 -->
<button class="tester-toggle" id="tester-toggle" onclick="toggleTester()" title="测试反馈面板">
  🧪
  <span class="badge hidden" id="tester-badge">0</span>
</button>

<aside class="tester-panel" id="tester-panel">
  <header>
    <h3>🧪 实时测试反馈</h3>
    <div class="actions">
      <button class="icon-mini" onclick="exportTesterReport()" title="导出报告">📋</button>
      <button class="icon-mini" onclick="clearTester()" title="清空">🗑</button>
      <button class="icon-mini" onclick="toggleTester()" title="关闭">✕</button>
    </div>
  </header>
  <div class="tester-stats">
    <div class="stat-cell">
      <div class="num pass" id="stat-pass">0</div>
      <div class="lbl">通过</div>
    </div>
    <div class="stat-cell">
      <div class="num fail" id="stat-fail">0</div>
      <div class="lbl">失败</div>
    </div>
    <div class="stat-cell">
      <div class="num warn" id="stat-warn">0</div>
      <div class="lbl">警告</div>
    </div>
    <div class="stat-cell">
      <div class="num" id="stat-total" style="color:var(--text-dim)">0</div>
      <div class="lbl">总数</div>
    </div>
  </div>
  <div class="tester-list" id="tester-list">
    <div class="tester-empty" id="tester-empty">
      <div class="ico">🧪</div>
      <div>暂无测试记录</div>
      <div style="font-size:10.5px;margin-top:6px">点击左侧任意按钮即可看到反馈</div>
    </div>
  </div>

// ============================================================
// 通用 HTTP（带自动测试反馈）
// ============================================================
async function call(method, path, body = null, opts = {}) {
  const init = { method, headers: { 'Accept': 'application/json' } };
  if (body !== null) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body);
  }
  const t0 = performance.now();
  try {
    const res = await fetch(BASE + path, init);
    const dt = Math.round(performance.now() - t0);
    const ct = res.headers.get('content-type') || '';
    let payload;
    if (ct.includes('application/json')) {
      try { payload = await res.json(); } catch { payload = null; }
    } else {
      payload = await res.text();
    }
    const result = { ok: res.ok, status: res.status, dt, data: payload };
    // 自动入栈测试反馈（silent 模式可跳过，比如流式请求）
    if (!opts.silent) recordTest(method, path, body, result);
    return result;
  } catch (e) {
    const dt = Math.round(performance.now() - t0);
    const result = { ok: false, status: 0, dt, error: String(e) };
    if (!opts.silent) recordTest(method, path, body, result);
    return result;
  }
}

function fmt(obj) {
  if (obj === null || obj === undefined) return 'null';
  if (typeof obj === 'string') return obj;
  try { return JSON.stringify(obj, null, 2); } catch { return String(obj); }
}

// 匹配路径规则
function matchContract(path) {
  // 完全匹配优先
  if (ENDPOINT_CONTRACT[path]) return ENDPOINT_CONTRACT[path];
  // 前缀匹配
  for (const [k, v] of Object.entries(ENDPOINT_CONTRACT)) {
    if (path.startsWith(k)) return v;
  }
  return null;
}

function runChecks(method, path, body, result) {
  const checks = [];

  // 1. HTTP 状态
  if (result.status === 0) {
    checks.push({ kind: 'fail', label: '连接', msg: `无法连接后端 (${result.error || 'network error'})` });
  } else if (result.ok) {
    checks.push({ kind: 'pass', label: 'HTTP', msg: `${result.status} ${result.dt}ms` });
  } else {
    checks.push({ kind: 'fail', label: 'HTTP', msg: `${result.status} (失败)` });
  }

  // 2. 响应时间
  if (result.dt < 500) {
    checks.push({ kind: 'pass', label: '耗时', msg: `${result.dt}ms（快）` });
  } else if (result.dt < 1000) {
    checks.push({ kind: 'pass', label: '耗时', msg: `${result.dt}ms（正常）` });
  } else if (result.dt < 3000) {
    checks.push({ kind: 'warn', label: '耗时', msg: `${result.dt}ms（偏慢）` });
  } else {
    checks.push({ kind: 'fail', label: '耗时', msg: `${result.dt}ms（慢！>3s）` });
  }

  // 仅在响应成功时检查字段与规则
  if (result.ok && result.data && typeof result.data === 'object') {
    const contract = matchContract(path);
    if (contract) {
      // 字段完整性
      if (contract.fields && contract.fields.length) {
        for (const f of contract.fields) {
          const present = f in result.data;
          checks.push({
            kind: present ? 'pass' : 'fail',
            label: '字段',
            msg: present ? `<code>${f}</code> ✓` : `<code>${f}</code> 缺失`
          });
        }
      }
      // 数据合理性
      if (contract.rules && contract.rules.length) {
        for (const rule of contract.rules) {
          try {
            const ok = rule.check(result.data);
            checks.push({
              kind: ok ? 'pass' : 'fail',
              label: '合理性',
              msg: ok ? `${rule.name} ✓` : `${rule.name}：${rule.msg(result.data)}`
            });
          } catch (e) {
            checks.push({ kind: 'warn', label: '合理性', msg: `${rule.name} 检查异常: ${e.message}` });
          }
        }
      }
    }
  } else if (result.ok && typeof result.data === 'string') {
    // 文本响应（Prometheus 等）
    checks.push({ kind: 'pass', label: '字段', msg: `文本响应 (${result.data.length} 字节)` });
  }

  return checks;
}

function buildCurl(method, path, body) {
  let c = `curl -X ${method} 'http://localhost:8000${path}' \\\n`;
  c += `  -H 'Accept: application/json'`;
  if (body) c += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(body).replace(/'/g, "'\\''")}'`;
  return c;
}

const testerEntries = [];
let testerCounter = 0;
let testerStats = { pass: 0, fail: 0, warn: 0 };

function recordTest(method, path, body, result) {
  const id = ++testerCounter;
  const checks = runChecks(method, path, body, result);
  const entry = {
    id, method, path, body, result, checks,
    timestamp: Date.now(),
    status: result.ok ? 'pass' : 'fail',
  };
  testerEntries.unshift(entry);
  // 仅保留最近 50 条
  if (testerEntries.length > 50) testerEntries.pop();

  // 更新统计
  testerStats = { pass: 0, fail: 0, warn: 0 };
  for (const e of testerEntries) {
    for (const c of e.checks) {
      if (c.kind === 'pass') testerStats.pass++;
      else if (c.kind === 'fail') testerStats.fail++;
      else if (c.kind === 'warn') testerStats.warn++;
    }
  }

  renderTesterPanel();
  updateTesterBadge();
}

function renderTesterPanel() {
  const list = document.getElementById('tester-list');
  const empty = document.getElementById('tester-empty');
  if (!list) return; // 防御：DOM 未就绪
  if (testerEntries.length === 0) {
    empty.style.display = 'block';
    list.querySelectorAll('.tester-entry').forEach(e => e.remove());
  } else {
    empty.style.display = 'none';
    // 增量更新：只 prepend 新条目（最新在顶部）
    // 找出 DOM 中已存在的 id 集合
    const existingIds = new Set(
      Array.from(list.querySelectorAll('.tester-entry'))
        .map(el => Number(el.dataset.id))
    );
    // 找出需要新增的条目（最新在前）
    const newOnes = [];
    for (const e of testerEntries) {
      if (!existingIds.has(e.id)) newOnes.push(e);
    }
    // 限制最大 50 条，超过则删最旧的 DOM
    const maxKeep = 50;
    const domEntries = Array.from(list.querySelectorAll('.tester-entry'));
    if (domEntries.length > maxKeep) {
      domEntries.slice(maxKeep).forEach(el => el.remove());
    }
    // prepend 新条目（注意顺序：最新的在最前）
    if (newOnes.length > 0) {
      const newHtml = newOnes.map(e => renderEntry(e)).join('');
      list.insertAdjacentHTML('afterbegin', newHtml);
    }
  }
  // 统计
  const sp = document.getElementById('stat-pass');
  const sf = document.getElementById('stat-fail');
  const sw = document.getElementById('stat-warn');
  const st = document.getElementById('stat-total');
  if (sp) sp.textContent = testerStats.pass;
  if (sf) sf.textContent = testerStats.fail;
  if (sw) sw.textContent = testerStats.warn;
  if (st) st.textContent = testerEntries.length;
}

function renderEntry(e) {
  const dtClass = e.result.dt > 3000 ? 'vslow' : e.result.dt > 1000 ? 'slow' : '';
  const time = new Date(e.timestamp).toLocaleTimeString('zh-CN', { hour12: false });
  const hasChecks = e.checks.some(c => c.kind === 'fail' || c.kind === 'warn');
  const preview = typeof e.result.data === 'object'
    ? JSON.stringify(e.result.data, null, 2).slice(0, 800)
    : String(e.result.data || '').slice(0, 800);
  return `
    <div class="tester-entry ${e.status}" data-id="${e.id}">
      <div class="head" onclick="toggleEntry(${e.id})">
        <span class="status-dot"></span>
        <span class="method ${e.method}">${e.method}</span>
        <span class="path" title="${e.path}">${e.path}</span>
        <span class="dt ${dtClass}">${e.result.dt}ms</span>
        ${hasChecks ? '<span style="color:var(--warning)">⚠</span>' : '<span style="color:var(--success)">✓</span>'}
        <span class="arrow">▶</span>
      </div>
      <div class="body">
        <div class="checks">
          ${e.checks.map(c => `
            <div class="check ${c.kind}">
              <span class="ico">${c.kind === 'pass' ? '✓' : c.kind === 'fail' ? '✗' : '⚠'}</span>
              <span class="label">${c.label}</span>
              <span class="msg">${c.msg}</span>
            </div>
          `).join('')}
        </div>
        <div class="timestamp">${time} · ${e.result.status}</div>
        <details style="margin-top:8px">
          <summary style="cursor:pointer;color:var(--text-dim);font-size:11px">📄 响应体（前 800 字符）</summary>
          <div class="resp-preview">${escapeHtml(preview)}</div>
        </details>
        <div class="actions-row">
          <button onclick="copyCurl(${e.id})">📋 复制 curl</button>
          <button onclick="replayRequest(${e.id})">▶ 重放</button>
          <button onclick="removeEntry(${e.id})">🗑 删除</button>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function toggleEntry(id) {
  const el = document.querySelector(`.tester-entry[data-id="${id}"]`);
  if (el) el.classList.toggle('open');
}

function copyCurl(id) {
  const e = testerEntries.find(x => x.id === id);
  if (!e) return;
  const curl = buildCurl(e.method, e.path, e.body);
  navigator.clipboard.writeText(curl).then(() => toast('curl 已复制', 'ok'));
}

async function replayRequest(id) {
  const e = testerEntries.find(x => x.id === id);
  if (!e) return;
  toast(`重放: ${e.method} ${e.path}`, 'ok');
  await call(e.method, e.path, e.body);
}

function removeEntry(id) {
  const idx = testerEntries.findIndex(e => e.id === id);
  if (idx >= 0) testerEntries.splice(idx, 1);
  renderTesterPanel();
  updateTesterBadge();
}

function clearTester() {
  testerEntries.length = 0;
  testerCounter = 0;
  testerStats = { pass: 0, fail: 0, warn: 0 };
  renderTesterPanel();
  updateTesterBadge();
  toast('已清空', 'ok');
}

function updateTesterBadge() {
  const badge = document.getElementById('tester-badge');
  const failCount = testerStats.fail;
  if (failCount > 0) {
    badge.textContent = failCount;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function toggleTester() {
  const panel = document.getElementById('tester-panel');
  panel.classList.toggle('open');
}

function exportTesterReport() {
  const lines = [
    `# 测试报告 · ${new Date().toLocaleString('zh-CN')}`,
    ``,
    `总计: ${testerEntries.length}`,
    `通过: ${testerStats.pass} | 失败: ${testerStats.fail} | 警告: ${testerStats.warn}`,
    ``,
    `---`,
  ];
  for (const e of testerEntries) {
    lines.push(`\n## [${e.result.status}] ${e.method} ${e.path} (${e.result.dt}ms)`);
    for (const c of e.checks) {
      const sym = c.kind === 'pass' ? '✓' : c.kind === 'fail' ? '✗' : '⚠';
      lines.push(`  ${sym} ${c.label}: ${c.msg.replace(/<[^>]+>/g, '')}`);
    }
    if (e.body) lines.push(`  body: ${JSON.stringify(e.body)}`);
  }
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => toast(`已复制 ${text.length} 字符到剪贴板`, 'ok'));
}

let chatAbort = null;
function appendChat(role, content) {
  const stream = document.getElementById('chat-stream');
  const msg = document.createElement('div');
  msg.className = `chat-msg ${role}`;
  const roleText = role === 'user' ? '用户' : role === 'assistant' ? '助手' : role === 'error' ? '错误' : '系统';
  msg.innerHTML = `<div class="role">${roleText}</div><div class="content"></div>`;
  msg.querySelector('.content').textContent = content;
  stream.appendChild(msg);
  stream.scrollTop = stream.scrollHeight;
  return msg;
}

  const out = document.getElementById('chat-health-out');
  if (r.ok) {
    out.innerHTML = `<span class="pass">✅ 在线 ${r.dt}ms</span>`;
  } else if (r.status === 0) {
    out.innerHTML = `<span class="fail">❌ 无法连接（确认 app.py 已启动）</span>`;
  } else {
    out.innerHTML = `<span class="warn">⚠️ HTTP ${r.status}</span>`;
  }
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  const session = document.getElementById('chat-session').value || 'default';
  appendChat('user', text);
  input.value = '';
  const sendBtn = document.getElementById('chat-send-btn');
  const stopBtn = document.getElementById('chat-stop-btn');
  sendBtn.disabled = true;
  stopBtn.disabled = false;
  const t0 = performance.now();
  chatAbort = new AbortController();
  try {
    const res = await fetch(BASE + '/api/agent/run/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_input: text, session_id: session, stream: true }),
      signal: chatAbort.signal,
    });
    // 手动记录流式请求
    recordTest('POST', '/api/agent/run/stream', { user_input: text, session_id: session },
      { ok: res.ok, status: res.status, dt: Math.round(performance.now() - t0), data: { streaming: true } });
    if (!res.ok) {
      const err = await res.text();
      appendChat('error', `[HTTP ${res.status}] ${err}`);
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    const assistantMsg = appendChat('assistant', '');
    const contentEl = assistantMsg.querySelector('.content');
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (!payload) continue;
        try {
          const obj = JSON.parse(payload);
          if (obj.type === 'content' || obj.type === 'text') {
            fullText += obj.data || obj.text || '';
            contentEl.textContent = fullText;
          } else if (obj.type === 'error') {
            contentEl.textContent = `⚠️ ${obj.data || '未知错误'}`;
            contentEl.style.color = 'var(--warning)';
          } else if (obj.type === 'tool_call') {
            fullText += `\n🔧 [工具调用] ${obj.data}\n`;
            contentEl.textContent = fullText;
          } else if (obj.type === 'tool_result') {
            fullText += `📦 ${obj.data}\n`;
            contentEl.textContent = fullText;
          }
        } catch (e) {
          // ignore
        }
      }
      const stream = document.getElementById('chat-stream');
      stream.scrollTop = stream.scrollHeight;
    }
    const dt = Math.round(performance.now() - t0);
    if (!fullText) {
      contentEl.textContent = `（无响应，${dt}ms）`;
    } else {
      contentEl.textContent += `\n\n—— ${dt}ms ——`;
    }
  } catch (e) {
    appendChat('error', String(e));
  } finally {
    sendBtn.disabled = false;
    stopBtn.disabled = true;
    chatAbort = null;
  }
}
window.sendChat = sendChat;

function stopChat() {
  if (chatAbort) chatAbort.abort();
}

  const map = { pending: '/api/hitl/pending', history: '/api/hitl/history?limit=20', stats: '/api/hitl/stats' };
  const r = await call('GET', map[type]);
  const out = document.getElementById('hitl-out');
  const list = document.getElementById('hitl-list');
  const countEl = document.getElementById('hitl-count');
  if (!r.ok) {
    list.innerHTML = '';
    out.textContent = `❌ HTTP ${r.status}`;
    countEl.textContent = '';
    return;
  }
  const data = r.data || {};
  let items = [];
  if (type === 'pending') items = data.pending || [];
  else if (type === 'history') items = data.history || [];
  countEl.textContent = `${type}=${items.length}`;
  if (type === 'stats') {
    out.textContent = fmt(data);
    list.innerHTML = '';
    return;
  }
  list.innerHTML = items.length === 0
    ? `<div class="empty"><div class="ico">✋</div>没有${type === 'pending' ? '待审批' : '历史'}</div>`
    : items.map(it => `
      <div class="list-item">
        <div class="ico">📋</div>
        <div class="body">
          <div class="title">${it.id || it.request_id || ''}</div>
          <div class="meta">${it.tool || it.action || ''} · ${it.risk || ''} · ${it.created_at || ''}</div>
        </div>
        ${type === 'pending' ? `
          <div class="actions">
            <button class="mini" onclick="decideHitl('${it.id || it.request_id}', 'approve')">批准</button>
            <button class="mini" onclick="decideHitl('${it.id || it.request_id}', 'reject')">拒绝</button>
          </div>
        ` : ''}
      </div>
    `).join('');
  out.textContent = fmt(r.data).slice(0, 600);
}
window.loadHitl = loadHitl;

async function decideHitl(id, decision) {
  const r = await call('POST', '/api/hitl/decide', { id, decision });
  if (r.ok) {
    toast(`已${decision === 'approve' ? '批准' : '拒绝'}`, 'ok');
    loadHitl('pending');
  } else {
    toast('决策失败', 'err');
  }
}
window.decideHitl = decideHitl;

// -------- API Explorer --------
async function apiExplorer() {
  const method = document.getElementById('ex-method').value;
  const path = document.getElementById('ex-path').value.trim();
  const bodyStr = document.getElementById('ex-body').value.trim();
  let body = null;
  if (bodyStr) {
    try { body = JSON.parse(bodyStr); }
    catch { toast('Body JSON 格式错误', 'err'); return; }
  }
  const out = document.getElementById('api_explorer-out');
  out.textContent = `${method} ${path} …`;
  const r = await call(method, path, body);
  if (r.ok) {
    out.innerHTML = `<span class="pass">✅ HTTP ${r.status} ${r.dt}ms</span>\n${fmt(r.data)}`;
  } else if (r.status === 0) {
    out.innerHTML = `<span class="fail">❌ 无法连接：${r.error}</span>`;
  } else {
    out.innerHTML = `<span class="fail">❌ HTTP ${r.status} ${r.dt}ms</span>\n${fmt(r.data)}`;
  }
}
window.apiExplorer = apiExplorer;

const ALL_TESTS = [
  { method: 'GET', path: '/api/health' },
  { method: 'GET', path: '/api/models' },
  { method: 'GET', path: '/api/capabilities' },
  { method: 'GET', path: '/api/agents' },

  { method: 'POST', path: '/api/permission/enforce', body: { enforce: false } },
  { method: 'GET', path: '/api/metrics/prometheus' },

async function runAllTests() {
  const out = document.getElementById('test_all-out');
  const statsEl = document.getElementById('test_all-stats');
  const btn = document.querySelector('#panel-test_all .primary');
  if (btn) btn.disabled = true;
  statsEl.style.display = 'grid';
  statsEl.innerHTML = '<div class="stat"><div class="num" style="color:var(--primary)">⏳</div><div class="lbl">运行中…</div></div>';
  out.textContent = `⏳ 开始跑全套 ${ALL_TESTS.length} 个测试…\n\n`;
  let pass = 0, fail = 0;
  const t0 = performance.now();
  const lines = [];
  for (let i = 0; i < ALL_TESTS.length; i++) {
    const t = ALL_TESTS[i];
    let r;
    try {
      // 使用 silent 模式：避免每个请求都重新渲染浮窗（性能关键）
      r = await call(t.method, t.path, t.body, { silent: true });
    } catch (e) {
      r = { ok: false, status: 0, dt: 0, error: String(e) };
    }
    const sym = r.ok ? '✅' : (r.status === 0 ? '🔌' : '❌');
    const cls = r.ok ? 'pass' : (r.status === 0 ? 'warn' : 'fail');
    lines.push(`<span class="${cls}">${sym}</span> [${r.status || 'ERR'}] ${r.dt}ms  ${t.method} <code>${t.path}</code>`);
    if (r.ok) pass++; else fail++;
    // 实时刷新（每 4 个刷一次，避免阻塞）
    if (i % 4 === 0 || i === ALL_TESTS.length - 1) {
      out.innerHTML = lines.join('<br>');
    }
  }
  const total = Math.round(performance.now() - t0);
  statsEl.innerHTML = `
    <div class="stat"><div class="num">${ALL_TESTS.length}</div><div class="lbl">总数</div></div>
    <div class="stat"><div class="num" style="color:var(--success)">${pass}</div><div class="lbl">通过</div></div>
    <div class="stat"><div class="num" style="color:var(--danger)">${fail}</div><div class="lbl">失败</div></div>
    <div class="stat"><div class="num">${total}ms</div><div class="lbl">总耗时</div></div>
    <div class="stat"><div class="num">${Math.round(pass / ALL_TESTS.length * 100)}%</div><div class="lbl">通过率</div></div>
  `;
  out.innerHTML = lines.join('<br>');
  // 在浮窗里加一条汇总记录
  recordTest('RUN', '/_all_tests', { total: ALL_TESTS.length, pass, fail, dt: total },
    { ok: fail === 0, status: fail === 0 ? 200 : 500, dt: total, data: { summary: '一键全量', pass, fail } });
  if (btn) btn.disabled = false;
}
window.runAllTests = runAllTests;
