[project]
name = "ai-agent"
version = "2.0.9"
description = "AI Agent 后端服务（LangChain + LangGraph + MCP）"
requires-python = ">=3.11"
authors = [{ name = "Colbert Lee", email = "colbert@example.com" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["ai-agent", "langchain", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.8",
    "ipython>=8.20",
    "argcomplete>=3.1",
]

[project.scripts]
ai-agent = "web_ui:run"
ai-agent-server = "web_ui:run"
ai-agent-test = "cli:test"
ai-agent-lint = "cli:lint"
ai-agent-format = "cli:format"

[project.urls]
Homepage = "https://github.com/colbertlee/langChain_langGraph"
Repository = "https://github.com/colbertlee/langChain_langGraph.git"
Issues = "https://github.com/colbertlee/langChain_langGraph/issues"
Discussions = "https://github.com/colbertlee/langChain_langGraph/discussions"
Changelog = "https://github.com/colbertlee/langChain_langGraph/blob/main/CHANGELOG.md"
Documentation = "https://github.com/colbertlee/langChain_langGraph/tree/main/ai_agent"
Releases = "https://github.com/colbertlee/langChain_langGraph/releases"
Funding = "https://github.com/sponsors/colbertlee"
Docker = "https://github.com/colbertlee/langChain_langGraph/pkgs/container/ai-agent-console"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "web_ui", "agent", "tools", "security", "config",
    "memory", "memory_store", "state_manager",
    "rag", "llm_reliability", "reliability",
    "streaming", "monitor", "observability",
    "permission", "human_in_loop", "context_manager",
    "context_db", "mcp_server", "mcp_tools", "start_mcp",
    "github_tools", "gitee_tools",
    "multi_agent", "multi_agent_integration", "multi_agent_examples",
    "negotiation", "task_intent", "task_scheduler",
    "skills", "plugin_manager", "sandbox",
    "message_bus", "message_protocol", "distributed_bus",
    "pub_sub_scenarios", "capability", "planner",
    "ab_testing", "adaptive_threshold", "multimodal",
    "sqlite_tools", "main", "cli",
    "harness", "harness_runner", "harness_storage", "harness_cli", "harness_observability",
]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.txt", "*.yml", "*.yaml", "*.toml"]

[tool.bumpversion]
current_version = "2.0.9"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "-m", "not slow and not integration",
]
markers = [
    "integration: 集成测试（需要外部依赖）",
    "network: 网络测试（需要真实 API）",
    "slow: 慢测试（>2s）",
    "legacy: 遗留测试（从根目录迁移来）",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:langchain_community.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "RUF002",
    "RUF003",
    "UP032",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F811", "B011"]
"cli.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true