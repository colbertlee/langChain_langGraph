[project]
name = "ai-agent"
version = "2.0.9"
description = "AI Agent 后端服务（LangChain + LangGraph + MCP）"
requires-python = ">=3.11"
# PEP 621 项目元数据
authors = [{ name = "Colbert Lee", email = "colbert@example.com" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["ai-agent", "langchain", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.8",
    "ipython>=8.20",
    "argcomplete>=3.1",   # shell completion（可选）
]

# ─────────────── CLI 命令 ───────────────
# 安装后（pip install -e .）会创建以下命令：
#   ai-agent              # 主命令：启动 Web 服务
#   ai-agent-server       # 同上别名
#   ai-agent-test         # 跑测试
#   ai-agent-lint         # 跑 ruff lint
#   ai-agent-format       # 自动格式化代码
[project.scripts]
ai-agent = "app:run"
ai-agent-server = "app:run"
ai-agent-test = "cli:test"
ai-agent-lint = "cli:lint"
ai-agent-format = "cli:format"

# ─────────────── PyPI 项目链接（PEP 753） ───────────────
# 在 PyPI 项目页右侧显示这些链接
[project.urls]
Homepage = "https://github.com/colbertlee/langChain_langGraph"
Repository = "https://github.com/colbertlee/langChain_langGraph.git"
Issues = "https://github.com/colbertlee/langChain_langGraph/issues"
Discussions = "https://github.com/colbertlee/langChain_langGraph/discussions"
Changelog = "https://github.com/colbertlee/langChain_langGraph/blob/main/CHANGELOG.md"
Documentation = "https://github.com/colbertlee/langChain_langGraph/tree/main/ai_agent"
Releases = "https://github.com/colbertlee/langChain_langGraph/releases"
Funding = "https://github.com/sponsors/colbertlee"
Docker = "https://github.com/colbertlee/langChain_langGraph/pkgs/container/ai-agent-console"

# ─────────────── 构建系统 ───────────────
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 扁平布局：所有 .py 文件属于同一个包 ai_agent
# 不需要 __init__.py
py-modules = [
    "app", "agent", "tools", "security", "config",
    "memory", "memory_store", "state_manager",
    "rag", "llm_reliability", "reliability",
    "streaming", "monitor", "observability",
    "permission", "human_in_loop", "context_manager",
    "context_db", "mcp_server", "mcp_tools", "start_mcp",
    "github_tools", "gitee_tools",
    "multi_agent", "multi_agent_integration", "multi_agent_examples",
    "negotiation", "task_intent", "task_scheduler",
    "skills", "plugin_manager", "sandbox",
    "message_bus", "message_protocol", "distributed_bus",
    "pub_sub_scenarios", "capability", "planner",
    "ab_testing", "adaptive_threshold", "multimodal",
    "sqlite_tools", "main", "cli",
    "harness_runner", "harness_storage", "harness_cli",
]

[tool.setuptools.package-dir]
"" = "."

# 包含 README 作为包元数据
[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.txt", "*.yml", "*.yaml", "*.toml"]

# ─────────────── 自动版本号管理 ───────────────
# 用法：
#   pip install bumpversion
#   bumpversion patch        # 0.1.0 → 0.1.1
#   bumpversion minor        # 0.1.0 → 0.2.0
#   bumpversion major        # 0.1.0 → 1.0.0
#   bumpversion --dry-run --verbose patch   # 试运行
# 自动 commit + tag（用 -c "git commit -a -m 'bump version {new_version}'"）
[tool.bumpversion]
current_version = "2.0.9"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
# 是否允许 dirty working tree
allow_dirty = false

# 同时改这些文件中的版本号
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = '![Coverage](./coverage-badge.svg)'
replace = '![Coverage](./coverage-badge.svg)\n\n> 当前版本：v{new_version}'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = '<!-- bumpversion placeholder -->'
replace = '<!-- bumpversion placeholder -->\n## v{new_version} ({now:%Y-%m-%d})\n\n- TODO: 写更新日志\n\n'

[tool.bumpversion.bump_message]
commit_message = "chore(release): bump version v{new_version}"
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"

# ─────────────── pytest-timeout 默认超时 ───────────────
# 防止测试 hang 死（CI runner 锁死）
# 1. 默认 60 秒超时（-m "not slow"）
# 2. slow 测试放宽到 600 秒
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    # ──── P2-3 / P2-7 覆盖率配置 ────
    # 注意：ai_agent 是 flat module（所有 .py 在 ai_agent/ 根），所以 `--cov=ai_agent`
    # 找不到任何代码。正确做法是 `--cov=.`（测 ai_agent 当前目录），
    # 或显式列出模块名。
    # 选用 `--cov=.`：让 pytest 自动从 cwd 抓取 .py 模块。
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-report=json:coverage.json",
    "--cov-branch",                 # branch coverage 开关（v8 提供 branch coverage）
    # P2-3 覆盖率门禁（CI 阻断）
    #
    # 当前 baseline（v2.4 P0/P1/P2 完成后）：
    #   lines:        37.62%
    #   functions:    32.x%
    #   branches:     25.x%
    #   statements:   38.05%
    #
    # P2-7 后（修复 6 个 legacy 文件 + 15 个用例）：
    #   lines:        ~38.x%
    #   （每多跑一组 legacy 用例会拉高 coverage 一两个百分点）
    #
    # 阈值设定策略（必须 < 当前 baseline - 2%，否则 CI 立即 fail 阻断所有 push）：
    #   * 当前值 35%：留 +2-3% 余量（小幅回归会失败）
    #   * 后续 PR：每 2-3 个月 +5%（50 → 55 → 60 → 65 → 70 → 80）
    #   * 目标值 80%：与 open-source AI agent 项目平均对齐（需 1-2 年）
    #
    # 单独跑：python -m pytest --cov-fail-under=80（手动检查能否达到目标）
    "--cov-fail-under=35",
    # P2-7：移除 `-m "not legacy"` 排除
    # 历史背景：v2.x 重构期间 6 个 legacy 文件被自动打 legacy 标记跳过；
    #         P2-7 已全部修复，所有测试默认全量跑。
    # 若需单独跑慢测试：pytest -m slow；跑集成：pytest -m integration。
    "-m", "not slow and not integration",
]
markers = [
    "integration: 集成测试（需要外部依赖）",
    "network: 网络测试（需要真实 API）",
    "slow: 慢测试（>2s）",
]
asyncio_mode = "auto"   # pytest-asyncio 自动 await
filterwarnings = [
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:langchain_community.*",
    "ignore::DeprecationWarning:harness_runner.*",   # v2.4 harness 内 langchain 旧路径 deprecation
]

# ─────────────── python-semantic-release 配置（替代 bumpversion） ───────────────
# 装：`pip install python-semantic-release[all]`
# 用法：`semantic-release publish` 或 `semantic-release version`
# 自动：
#   1. 解析 commit message（Conventional Commits）
#   2. 计算 next version（feat → minor, fix → patch, BREAKING CHANGE → major）
#   3. 更新 pyproject.toml version
#   4. 生成 CHANGELOG.md
#   5. git commit + tag
#   6. （可选）publish 到 PyPI
#   7. （可选）创建 GitHub Release
#
# 与 bumpversion 对比：
#   - bumpversion：手动 `bumpversion patch/minor/major`，简单直接
#   - semantic-release：自动从 commit message 计算，更智能（推荐 commit 规范后用）
#
# 两者可同时存在，按需选择。当前用 bumpversion 即可。
[tool.semantic_release]
# 版本字符串格式
version_variable = "pyproject.toml:project.version"   # 用 pyproject.toml 而非 __init__.py
# major_on_zero = true   # 0.x.y 中破坏性变更 → bump major（否则 bump minor）
branch = "main"             # 主分支
upload_to_pypi = false      # 不自动 PyPI（用 release.yml workflow 配 trusted publishing）
upload_to_release = false   # 不自动 GitHub Release（用 release.yml）
hvcs = "github"             # GitHub 集成
commit_version_number = true
tag_commit = true
# commit message 格式
commit_message = "chore(release): v{version} [skip ci]\n\nAutomatically generated by semantic-release"
# CHANGELOG 配置
changelog_file = "CHANGELOG.md"
changelog_omit_zero_versions = true
# ─────────────── 防 main 分支冲突配置 ───────────────
# 用 commit_author + push-mode 配置回退分支
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
# push 模式：先 commit 到 release 分支，merge 到 main（防止 force-push main）
push_mode = "tag"  # 只 push tag，不直接 force-push main
# 备选 push_mode:
#   - "tag"（推荐）：只 push tag，由外部流程（release.yml）触发 publish
#   - "branch"：force-push main（不安全）
#   - "follow"：跟随 commit
# 在 CI 上用 PAT_BOT 时，仍需要 write 权限

[tool.semantic_release.commit_parser_options]
# conventional commit 解析
allowed_types = ["feat", "fix", "perf", "refactor", "docs", "test", "chore", "ci", "build", "style"]
# feat → minor, fix → patch, BREAKING CHANGE → major

[tool.semantic_release.changelog_generator_options]
# changelog 模板
template = """\
# Changelog

AI Agent 项目更新记录。

{% for version, grouped_commits in versions.items() %}
## v{{ version }} ({{ grouped_commits[0].commit.hexsha[:7] }} - {{ grouped_commits[0].commit.committer.date.strftime("%Y-%m-%d") }})

{% for type, commits in grouped_commits | groupby("type") -%}
### {{ type | title }}

{% for commit in commits -%}
- {{ commit.subject.rstrip() }} ({{ commit.commit.hexsha[:7] }})
{% endfor %}
{% endfor %}
{% endfor %}\
"""

[tool.ruff]
line-length = 120
target-version = "py311"
# 排除业务代码里的大量中文 docstring 全角字符（避免噪音）
# 注意：新增文件请保留中文 docstring（用半角字符）

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line-too-long（line-length=120 仍可能误报，ref 字符串常用）
    "B008",   # do not perform function calls in argument defaults（FastAPI Depends 模式）
    "RUF002", # ambiguous characters in docstring（中文 docstring 不可避免）
    "RUF003", # ambiguous characters in comment
    "UP032",  # 使用 f-string 而不是 format()（遗留代码兼容）
]

[tool.ruff.lint.per-file-ignores]
# 测试文件可以长、未使用导入等
"tests/**/*.py" = ["F401", "F811", "B011"]
# cli.py 是脚本入口，允许 any
"cli.py" = ["F401"]

[tool.ruff.format]
# 配套格式化规则（用于 ai-agent-format）
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.coverage.run]
source = ["."]
branch = true   # P2-3：开启 branch coverage
omit = [
    "tests/*",
    "test_*.py",
    "htmlcov/*",
    "uploads/*",
    "knowledge_base/*",
    "docs/*",
    "web/*",
    # v2.4+ harness / obs 模块：路径独立，不算 agent 核心
    "harness_*",
    "evals/*",
    "examples/*",
]

[tool.coverage.report]
# P2-3 — 排除常见不计入覆盖率的代码模式
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
    "except Exception as e:.*continue",   # 兜底容错，不应强制覆盖
    "logger\\.(debug|info|warning|error)\\(.*$",  # log 调用无业务逻辑
    "\\.\\.\\.",                                  # `...` Ellipsis（部分代码用）
    "# type: ignore",                             # 类型忽略注释
    "# noqa",
    "@overload",
]
# 跳过 100% 覆盖的文件（避免大量 noise）
skip_empty = true
skip_covered = false   # 仍报告全覆盖文件以便审计
show_missing = true
precision = 1          # 报告保留 1 位小数（与 Codecov 一致）
sort = "-Cover"        # 覆盖率最低的列前（找出风险模块）
# P2-3 — 分层 thresholds（pytest-cov 7+ 支持）
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
